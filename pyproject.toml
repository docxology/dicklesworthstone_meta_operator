# Dicklesworthstone Meta-Operator Configuration
# Inherits workspace settings from the template monorepo root pyproject.toml
# when run from there; standalone `uv run` builds a project-local venv.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dicklesworthstone_meta_operator"
version = "0.2.0"
license = {text = "MIT"}
description = "Meta-operator over the Dicklesworthstone GitHub corpus: clone, verify upstream sync, orchestrate, interpret, dashboard"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: long-running integration checks kept for release profiles",
]

[tool.coverage.run]
# Coverage is measured for primary source code (src/) only.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate (zero-mock standard).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

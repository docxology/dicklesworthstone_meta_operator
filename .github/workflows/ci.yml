name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.15" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ensure tests were collected
        run: |
          COLLECTED=$(uv run --locked python -m pytest tests/ --collect-only -q)
          echo "collected: $COLLECTED"
          echo "$COLLECTED" | grep -Eq '[1-9][0-9]* tests? collected'
      - name: Run tests with coverage gate
        run: TMPDIR="$RUNNER_TEMP" bash scripts/gate.sh
      - name: Generate figures from tracked artifacts
        run: |
          uv run --locked python scripts/65_generate_figures.py --out-dir "$RUNNER_TEMP/figures"
          test -s "$RUNNER_TEMP/figures/fig_state_distribution.png"
      - name: Zero-mock audit
        run: |
          if grep -rn --include="*.py" "unittest\.mock\|MagicMock\|@patch\|create_autospec" tests/; then
            echo "VIOLATION — mocks found in tests/"; exit 1
          else
            echo "Clean — no mocks found"
          fi
